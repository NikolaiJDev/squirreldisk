name: squirreldisk
description: A Flutter application for disk usage analysis and visualization
version: 0.3.4+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI and State Management
  provider: ^6.1.1
  cupertino_icons: ^1.0.2
  
  # File System and Platform
  path_provider: ^2.1.1
  path: ^1.8.3
  file_picker: ^6.1.1
  
  # Charts and Visualization
  fl_chart: ^0.65.0
  
  # Utilities
  pretty_bytes: ^2.0.1
  uuid: ^4.1.0
  
  # Platform Integration
  window_manager: ^0.3.7
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700